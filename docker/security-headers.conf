# docker/security-headers.conf
# Included at server {} level AND inside any location {} that sets its own
# add_header (nginx inheritance: one location-level add_header drops every
# inherited one). $hsts_header / $csp_frame_ancestors / $x_frame_options /
# $coop_header come from the set blocks in docker/nginx.conf.
# add_header skips a header entirely when its value resolves to "".

# script-src is minimal: 'self' plus 'wasm-unsafe-eval' for WASM verification.
# Third-party script origins were audited, found unused, and removed — add new
# hosts only with evidence they are actually loaded by the app.
# frame-src is restricted to the sole constructed embed host (the YouTube
# nocookie player, hardcoded in youtube-player.tsx). Schemeless host tokens
# are dropped so nothing can inherit http: on plain-HTTP deployments.
add_header Content-Security-Policy "default-src 'self'; manifest-src *; child-src 'none'; worker-src 'self'; frame-src https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; connect-src *; img-src * data: blob:; font-src 'self'; media-src * blob:; script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $csp_frame_ancestors" always;

add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $x_frame_options always;
add_header Cross-Origin-Opener-Policy $coop_header always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=()" always;
