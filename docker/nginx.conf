# Route-scoped security headers (http context; mounted at /etc/nginx/conf.d/default.conf).
# HSTS emits only on HTTPS (native TLS or exact single-proxy X-Forwarded-Proto: https).
# Roll out at max-age=86400; raise to 31536000 after verifying production topology.
map "$scheme:$http_x_forwarded_proto" $hsts_header {
    default         "";
    "~^https:"      "max-age=86400; includeSubDomains";
    "~^http:https$" "max-age=86400; includeSubDomains";
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Default locked-down policy (runs once in server-rewrite phase, before
    # location match). Overridden per-location for framable surfaces below.
    set $csp_frame_ancestors "'none'";
    set $x_frame_options "DENY";
    set $coop_header "same-origin";

    include /etc/nginx/snippets/security-headers.conf;

    # OBS alert overlay entrypoint (separate Vite build input: alert.html).
    # Fixes fallback to index.html / SPA error route on /alert/<id>/<type> (S-9).
    location ~ ^/alert(\.html)?(/|$) {
        set $csp_frame_ancestors "*";
        set $x_frame_options "";
        set $coop_header "unsafe-none";
        try_files $uri @alert_fallback;
    }

    # Intentional embed/popout routes verified in src/routes.tsx
    # (/embed/:id line 191, /chat/:id line 186, /widgets line 102).
    location ~ ^/(embed|chat|widgets)(/|$) {
        set $csp_frame_ancestors "*";
        set $x_frame_options "";
        set $coop_header "unsafe-none";
        try_files $uri @spa_fallback;
    }

    # Immutable hashed Vite assets (outDir "build", default assetsDir "assets").
    # ^~ keeps regex locations from stealing asset paths. NO `always` on
    # Cache-Control: with it, a transient 404/5xx would be cached for a year by
    # browsers and CDNs (empirically confirmed). Re-include the snippet because
    # any location-level add_header drops inherited server-level headers.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @spa_fallback;
    }

    # Named fallbacks preserve location-scoped variables across the internal
    # redirect (server-rewrite phase does not re-run; the `set` values set in
    # the matched regex location survive).
    location @spa_fallback {
        rewrite ^ /index.html break;
    }

    location @alert_fallback {
        rewrite ^ /alert.html break;
    }
}
