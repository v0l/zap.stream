version: 2
updates:
  # bun.lock version updates (GA since Feb 2025). Note: dependabot alerts do
  # not parse bun.lock for transitive advisories yet — an osv-scanner CI step
  # would cover that gap (not yet present in this repo).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
  # keeps the digest pins in Dockerfile.ssr / Dockerfile.prebuilt current
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
