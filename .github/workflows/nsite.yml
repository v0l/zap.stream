name: Deploy nsite
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Redirect 404 to Index for SPA
        run: cp build/index.html build/404.html

      - name: Deploy nsite
        env:
          NSITE_KEY: ${{ secrets.NSITE_KEY }}
        run: |
          curl -sSfL -o nsyte https://github.com/sandwichfarm/nsyte/releases/download/v0.29.0/nsyte-linux-0.29.0
          echo "269a497b63ef4b6d0afd7fe301dfc6135cd563229013d0c118adaca354a5228e  nsyte" | sha256sum -c -
          chmod +x nsyte
          printf '%s\n' "$NSITE_KEY" | ./nsyte deploy build -i --prompt-sec --skip-secrets-scan \
            --servers 'https://nostr.download,https://blossom.band' \
            --relays 'wss://relay.primal.net,wss://relay.damus.io,wss://nos.lol,wss://relay.snort.social'
