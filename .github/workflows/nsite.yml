name: Deploy nsite
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Redirect 404 to Index for SPA
        run: cp build/index.html build/404.html

      - name: Deploy nsite
        env:
          NSITE_KEY: ${{ secrets.NSITE_KEY }}
        run: |
          # nsite-cli reads the signing key from .nsite/project.json when
          # --privatekey is not given; a file keeps the nsec out of argv,
          # where it is visible in process listings and error output.
          mkdir -p .nsite
          printf '{"privateKey": "%s"}\n' "$NSITE_KEY" > .nsite/project.json
          npx -y nsite-cli@0.1.18 upload build --verbose --purge --servers 'https://nostr.download,https://blossom.band'
          rm -f .nsite/project.json
