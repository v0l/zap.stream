name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      - run: bun biome lint src/ packages/zap-stream-api/src/ e2e/ playwright.config.ts

      - run: bun tsc --noEmit

      - run: bun test src packages/zap-stream-api/src/

      - run: bun run build

  login-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: login-browser-failures
          path: test-results/
          retention-days: 7

  prebuilt-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker.yml only builds Dockerfile.ssr; the prebuilt image is built by
      # hand, so a parse/config error there ships unnoticed (this would have
      # caught e.g. a trailing comment after FROM, which Dockerfiles reject).
      - name: Build Dockerfile.prebuilt against a dummy context
        run: |
          mkdir -p build
          echo '<!doctype html><title>ci</title>' > build/index.html
          docker build -f Dockerfile.prebuilt -t zap-stream-prebuilt:ci .
