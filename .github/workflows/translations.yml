name: Translations

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install

      - name: Upload sources
        run: npx -y @crowdin/cli@5.5.0 upload sources -b main -T ${{ secrets.CROWDIN_TOKEN }}

      - name: Pull translations
        run: npx -y @crowdin/cli@5.5.0 pull -b main -T ${{ secrets.CROWDIN_TOKEN }}

      - run: bun biome lint --write .

      - name: Commit and push
        run: |
          git config user.email "ci@v0l.io"
          git config user.name "CI"
          git add src/translations/ src/lang.json
          if output=$(git status --porcelain -- src/translations/ src/lang.json) && [ -n "$output" ]; then
            git commit -m "chore: Update translations"
            git push
          fi
